    <div class="auth-card">
      
<h1>Reset your password</h1>
<p class="small muted">Enter your email and we will send a single-use reset link. It expires in one hour.</p>
<form class="auth-form" id="forgot-form" novalidate>
  <div class="field">
    <label class="label" for="email">Email address</label>
    <input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
  </div>
  <div id="form-status" class="hide" role="alert"></div>
  <button class="btn btn-primary btn-lg btn-block" type="submit" id="submit-btn">Send reset link</button>
</form>
<div id="outbox-slot"></div>
<div class="auth-foot">Remembered it? <a href="login.html">Back to log in</a></div>

    </div>
  </main>
