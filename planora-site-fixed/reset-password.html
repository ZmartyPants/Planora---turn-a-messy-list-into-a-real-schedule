<body>

<div class="auth-wrap">
  <aside class="auth-aside">
    <a href="index.html" class="brand" aria-label="Planora home">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none">
      <path d="M4 19V5.6c0-.4.4-.7.8-.6l7 2.1c.4.1.7.5.7.9V21c0 .4-.5.7-.9.5l-6.8-2.1a1 1 0 0 1-.8-1Z" fill="currentColor" opacity=".95"/>
      <path d="M20 19V5.6c0-.4-.4-.7-.8-.6l-7 2.1a1 1 0 0 0-.7.9V21c0 .4.5.7.9.5l6.8-2.1a1 1 0 0 0 .8-1Z" fill="currentColor" opacity=".55"/>
      </svg></span>Planora<span class="brand-dot">.</span>
    </a>
    <div class="auth-quote">
      <p>“New password, same plan.”</p>
      <span>Planora keeps your tasks, deadlines and time in one honest workspace.</span>
    </div>
    <div class="row gap-16 small muted" style="position:relative">
      <a href="index.html" class="link">Back to site</a>
      <button class="btn btn-icon btn-ghost" data-theme-toggle aria-label="Toggle dark mode" data-theme-icon></button>
    </div>
  </aside>
  <main class="auth-main">
    <div class="auth-card">
      
<h1>Choose a new password</h1>
<p class="small muted" id="reset-intro">Enter a new password for your account.</p>
<form class="auth-form" id="reset-form" novalidate>
  <div class="field">
      <label class="label" for="password">New password</label>
      <div class="pw-wrap">
        <input class="input" id="password" name="password" type="password" autocomplete="new-password" required>
        <button class="pw-toggle" type="button" data-pw-toggle="password" aria-label="Show password">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <span class="hint">At least 8 characters, with a letter and a number.</span>
    </div>
  <div class="pw-meter" id="pw-meter" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="field">
    <label class="label" for="confirm">Confirm new password</label>
    <input class="input" id="confirm" name="confirm" type="password" autocomplete="new-password" required>
  </div>
  <div id="form-status" class="hide" role="alert"></div>
  <button class="btn btn-primary btn-lg btn-block" type="submit" id="submit-btn">Update password</button>
</form>
<div class="auth-foot"><a href="login.html">Back to log in</a></div>

    </div>
  </main>
</div>
<script src="/assets/js/config.js"></script>
